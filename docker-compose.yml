version: "3.8"

services:
  # Primary unified application service (React 3D frontend + FastAPI backend + Gradio)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sepsiswatch-x-platform
    image: sepsiswatch-x:latest
    restart: unless-stopped
    ports:
      - "${PORT:-7860}:7860"
    environment:
      - PORT=7860
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./data/sepsiswatch.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional PostgreSQL service for enterprise EHR scale
  postgres:
    image: postgres:16-alpine
    container_name: sepsiswatch-x-postgres
    restart: unless-stopped
    profiles:
      - postgres
      - enterprise
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sepsiswatch
      POSTGRES_PASSWORD: sepsiswatch_password
      POSTGRES_DB: sepsiswatch_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sepsiswatch -d sepsiswatch_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
